<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newsletter Sign Up with Success Message</title>
    <!-- Favicon Link -->
    <link
      rel="shortcut icon"
      href="images/favicon-32x32.png"
      type="image/x-icon"
    />
    <!-- CSS Styling -->
    <link rel="stylesheet" href="styles/style.css" />
    <!-- Scripting Link -->
    <script defer type="module" src="script/script.js"></script>
  </head>
  <body>
    <div class="wrapper" role="main">
      <div class="newsletter">
        <div class="letter-img">
          <img src="images/illustration-sign-up-mobile.svg" loading="lazy" class="mobile-img"/>
          <img src="images/illustration-sign-up-desktop.svg" loading="lazy" class="dsk-img"/>
        </div>
        <div class="letter-details">
          <h2>Stay updated!</h2>
          <p class="h2-tag">
            Join 60,000+ products managers receiving monthly updated on:
          </p>
          <div class="letter-lists">
            <div class="list">
              <span><img src="images/icon-list.svg" /></span>
              <p>Product discovery and building what matters</p>
            </div>
            <div class="list">
              <span><img src="images/icon-list.svg" /></span>
              <p>Measuring to ensure updates are a success</p>
            </div>
            <div class="list">
              <span><img src="images/icon-list.svg" /></span>
              <p>And much more!</p>
            </div>
          </div>
          <form action="successMessage.html" id="emailForm">
            <div class="form-group">
              <div class="form-labels">
                <p class="label">Email address</p>
                <p id="errorMessage"></p>
              </div>
              <input
                type="text"
                name="email"
                id="email"
                placeholder="email@company.com"
              />
            </div>
            <button type="submit" id="submit-btn">
              Subscribe to monthly newsletter
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
